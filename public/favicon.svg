<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" rx="40" fill="#FFFFFF"/>
  <rect width="180" height="180" rx="40" fill="none" stroke="#2563EB" stroke-width="3" opacity="0.12"/>
  <text x="90" y="108" font-family="sans-serif" font-size="88" font-weight="900"
    fill="#2563EB" text-anchor="middle">K</text>
  <text x="90" y="138" font-family="sans-serif" font-size="18" font-weight="700"
    fill="#2563EB" text-anchor="middle" opacity="0.55" letter-spacing="4">KEYMAN</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <clipPath id="r">
      <rect width="180" height="180" rx="40"/>
    </clipPath>
  </defs>
  <!-- 흰 배경 -->
  <rect width="180" height="180" rx="40" fill="#FFFFFF"/>
  <!-- 연한 블루 테두리 -->
  <rect width="180" height="180" rx="40" fill="none" stroke="#2563EB" stroke-width="3" opacity="0.12"/>
  <!-- K 글자 -->
  <text x="90" y="108" font-family="'Noto Sans KR', sans-serif" font-size="88" font-weight="900"
    fill="#2563EB" text-anchor="middle" dominant-baseline="auto">K</text>
  <!-- KEYMAN 작은 텍스트 -->
  <text x="90" y="138" font-family="'Noto Sans KR', sans-serif" font-size="18" font-weight="700"
    fill="#2563EB" text-anchor="middle" opacity="0.55" letter-spacing="4">KEYMAN</text>
</svg>
